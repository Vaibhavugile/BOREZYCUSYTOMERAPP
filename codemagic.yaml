workflows:
  ios-release:
    name: iOS Release

    max_build_duration: 120

    environment:
      flutter: stable
      xcode: 15.4

    scripts:
      - name: Flutter clean
        script: |
          flutter clean

      - name: Flutter pub get
        script: |
          flutter pub get

      - name: Remove old pods
        script: |
          cd ios
          rm -rf Pods
          rm -rf Podfile.lock

      - name: Install pods
        script: |
          cd ios
          pod install

      - name: Build IPA
        script: |
          flutter build ipa --release

    artifacts:
      - build/ios/ipa/*.ipa